<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大坝巡检、缺陷与应急管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}input,select{padding:.4rem;margin:.2rem 0;width:100%;box-sizing:border-box}label{font-size:.85rem;color:#5a6b7b}.card{border:1px solid #d7dee5;border-radius:6px;padding:1rem;margin:1rem 0}</style></head><body><h1>大坝巡检、缺陷与应急管理</h1><p>安排巡检，记录渗流、位移、裂缝等缺陷并跟踪修复、复检和应急预案</p><p>异常值比控制阈值越高，缺陷优先级越高；应急处置缺陷必须完成复检并记录证据后才能关闭。</p><button onclick="loadItems()">刷新列表</button><div class="card"><h2>断网补传读数</h2><p style="font-size:.85rem;color:#5a6b7b">现场观测时间早于处置时间的读数不会被丢弃；补传后旧复核结论失效并重算，原处置与审计记录仍可查。</p><label>缺陷ID</label><input id="bf-item" placeholder="例如 1"><label>批次号 batch_id（重试时保持一致以幂等）</label><input id="bf-batch" placeholder="例如 B-20260930-01"><label>expected_version（乐观锁）</label><input id="bf-version" type="number" placeholder="例如 1"><label>读数（每行一条：kind,value,unit,observed_at）</label><textarea id="bf-readings" rows="4" style="width:100%;box-sizing:border-box">seepage,12.5,L/s,2026-09-29T08:00:00+00:00
displacement,3.1,mm,2026-09-29T09:00:00+00:00</textarea><button onclick="backfill()">提交补传</button><button onclick="loadReviews()">查看复核历史</button></div><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
function parseReadings(){return document.getElementById('bf-readings').value.trim().split(/\n+/).map(l=>{const [kind,value,unit,observed_at]=l.split(',');return {kind:kind.trim(),value:parseFloat(value),unit:unit.trim(),observed_at:observed_at.trim()}})}
async function backfill(){const id=document.getElementById('bf-item').value.trim();const body={batch_id:document.getElementById('bf-batch').value.trim(),expected_version:parseInt(document.getElementById('bf-version').value,10),readings:parseReadings()};const r=await fetch('/api/items/'+id+'/readings/backfill',{method:'POST',headers:{'Content-Type':'application/json','X-Actor':'demo','X-Role':'inspector'},body:JSON.stringify(body)});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
async function loadReviews(){const id=document.getElementById('bf-item').value.trim();const r=await fetch('/api/items/'+id+'/reviews',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
